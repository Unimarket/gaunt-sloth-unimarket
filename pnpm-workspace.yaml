packages:
  - 'packages/*'
  # BATCH-13: standalone, private (unpublished) live MCP authz integration suite for `gth eval`.
  # Not part of the root `build` script nor `pnpm run it`; run on demand via evals/mcp-authz/run.sh.
  - 'evals/mcp-authz'

# Dependency overrides live HERE and nowhere else. pnpm reads this block (and `pnpm.overrides`
# inside package.json); it does NOT read a top-level `overrides` key, which is npm's syntax.
# Nothing warns about one — the install exits 0 and the lockfile simply never mentions it, so a
# pin written there looks applied while holding nothing down. Prove an override took by reading
# it back out of pnpm-lock.yaml's own `overrides:` section, never from a green install.
# packages/core/spec/pnpmOverridesGate.spec.ts fails if a manifest grows a key pnpm will ignore.

# Force a single copy of @langchain/core across the workspace. A workspace
# package can resolve a provider (e.g. @langchain/xai) via its optional
# peerDependency at a patch built against an older core than the app's direct
# dependency, leaving two copies of @langchain/core in the tree and a nominal
# type clash ("ChatXAI is not assignable to BaseChatModel"). Deduping core alone
# is enough — the provider copies then all build against the same core type.
overrides:
  '@langchain/core': ^1.2.13

  # TUI-C35 — keep the chalk the TUI touches a SINGLE physical module while moving it to chalk 6.
  # The app renders through Ink and through its own markdown renderer, and both reach the same
  # `chalk` default export; that shared instance is what the TUI's startup colour clamp mutates
  # (see packages/app/src/tui/colour.ts). ink 7.1.1 declares chalk ^5.6.2, so bumping only
  # packages/app would leave Ink on chalk 5 — a second instance the clamp cannot reach, i.e.
  # exactly the second colour policy this work exists to remove.
  #
  # This is SCOPED on purpose; a blanket `chalk` override is wrong here. It would also rewrite
  # @microsoft/tui-test (chalk 5.6.2) — the PTY harness that gates this very change — and the
  # chalk 4.1.2 copies the jest packages under it still use. chalk 4 is consumed as CommonJS and
  # chalk 6 is ESM-only, so a blanket override is a hard break rather than an upgrade.
  'ink>chalk': ^6.0.0

  # OPS-120 — there is deliberately NO `minimatch` override, and minimatch 9.0.9 in the tree is
  # expected rather than a gap. The tree holds 10.2.6 for eslint, typescript-eslint and typedoc,
  # and 9.0.9 for glob 10.5.0 under @microsoft/tui-test — the PTY harness that gates
  # `pnpm run it-tui`. The ReDoS advisories against minimatch are fixed on every major line,
  # 9.x included, from 9.0.7; 9.0.9 is above that floor and no advisory matches it. So a blanket
  # `minimatch: ^10` would buy no security and would force glob off its own declared `^9.0.4`
  # onto a major it does not support — the same argument the scoped `ink>chalk` entry above
  # makes about this same harness. A scoped exemption is not available either: pnpm's selector
  # grammar splits at the FIRST `>` into exactly parent and child, so a three-segment path like
  # `@microsoft/tui-test>glob>minimatch` does not parse.

# Dependencies with install/build scripts pnpm is allowed to run (the pnpm
# equivalent of npm's allow-scripts approval). These are transitive dev/test
# deps: node-pty + @swc/core come from @microsoft/tui-test (the TUI e2e harness).
# Without this, pnpm skips their postinstall/native-build steps and aborts with
# ERR_PNPM_IGNORED_BUILDS. pnpm 11.3.0 uses the `allowBuilds` map; it is written
# by `pnpm approve-builds`.
allowBuilds:
  '@swc/core': true
  node-pty: true

# Strict mode: refuse an immature package outright rather than install it and append an exception
# here. A refusal is this guard working, not a broken build.
#
# Remedies, in order of preference: wait out the 24-hour window and install again; pin the older
# mature version deliberately; or, only if it is genuinely urgent, have a HUMAN add a reviewed and
# explicitly temporary exclusion and remove it once the version has aged. It is never "add the
# package so the build goes green" — that is the behaviour strict mode exists to stop.
#
# It looks inert at first: the flag is not part of pnpm's lockfile-verification cache key, so where
# this lockfile is already verified the check is skipped and an install exits 0 in about 200 ms
# having checked nothing. It starts biting when the lockfile next changes.
#
# The window is 1440 minutes — the 24 hours the remedies above name. It is written out rather than
# left to pnpm's default because that default is undocumented: measured on pnpm 11.3.0 (the version
# `packageManager` pins here), an absent value enforced this very same 24-hour cutoff, so this line
# changes nothing today, and a future pnpm that moved its default could not silently falsify the 24
# hours promised above. Two careful readers had already taken the missing value for a window of
# length zero (OPS-128).
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

# Exemptions from the minimum-release-age gate. The gate exists to keep a freshly published
# third-party version out of the tree until someone would have noticed it going wrong; a package we
# publish ourselves has no such unknown behind it, so it is exempt and listed bare (OPS-115). A bare
# name matches every version, so nothing here needs a hand edit when one of our releases lands.
#
# ONE entry per package name. pnpm returns on the first rule whose name matches and never consults a
# later one, so a second entry for the same package is silently ignored and the exception it names is
# not in force — including the plain `name@version` line `pnpm install` appends for itself when it
# meets an immature package, which lands after these and is dead on arrival. Splitting a package's
# versions into a line per version looks tidier and switches the exception off with no error anywhere.
#
# A bare entry already grants every version, so pnpm never has anything to append for our own
# packages: an appended line here is third-party by construction, and worth a look before it is kept.
# The list covers what we publish, not only what a manifest names today: our own packages depend on
# each other, so a bare entry for one of them drags its siblings in as transitive dependencies and
# the gate stops the install on those instead.
minimumReleaseAgeExclude:
  - '@gaunt-sloth/agent'
  - '@gaunt-sloth/batch'
  - '@gaunt-sloth/core'
  - '@gaunt-sloth/review'
